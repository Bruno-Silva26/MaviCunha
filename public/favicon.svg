<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Mavi Cunha 14">
<title>Mavi Cunha 14</title>
<!-- Pastilha amarela com o numero, igual ao selo do hero. A onca completa esta em
     apple-touch-icon.png e icon-512.png: nesses tamanhos ela aparece grande e le-se bem.
     Em 16px as ~40 pintas viram ruido e apagam a silhueta, por isso a aba usa o numero. -->
<rect width="100" height="100" rx="20" fill="#FFD400"/>
<text x="50" y="53" fill="#0A0A0A" font-family="Archivo Black, Arial Black, Helvetica, sans-serif"
      font-weight="900" font-size="68" text-anchor="middle" dominant-baseline="central"
      letter-spacing="-4">14</text>
</svg>